<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Picagem Rápida - SEMRUMO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .clock-display {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }

        .info-box {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 14px;
        }

        .info-box.success {
            background: #d4edda;
            color: #155724;
        }

        .info-box.error {
            background: #f8d7da;
            color: #721c24;
        }

        .info-box.loading {
            background: #cfe2ff;
            color: #084298;
        }

        .info-box.warning {
            background: #fff3cd;
            color: #856404;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        button {
            flex: 1;
            background: #667eea;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        button.entrada:not(:disabled) {
            background: #28a745;
        }

        button.entrada:hover:not(:disabled) {
            background: #218838;
            transform: translateY(-2px);
        }

        button.saida:not(:disabled) {
            background: #dc3545;
        }

        button.saida:hover:not(:disabled) {
            background: #c82333;
            transform: translateY(-2px);
        }

        .location-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(0,0,0,.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⏰</div>
        <h1>Picagem Rápida</h1>
        <p class="subtitle">SEMRUMO - Sistema de Ponto</p>

        <div class="clock-display" id="clock">--:--:--</div>

        <div class="info-box loading" id="status">
            <span class="spinner"></span> A iniciar...
        </div>

        <div class="btn-group">
            <button class="entrada" id="btnEntrada" disabled>
                ✅ ENTRADA
            </button>
            <button class="saida" id="btnSaida" disabled>
                🚪 SAÍDA
            </button>
        </div>

        <div class="location-info" id="locationInfo" style="display:none;">
            <strong>📍 Localização:</strong>
            <div id="locationDetails">--</div>
        </div>

        <div id="userInfo" style="font-size: 12px; color: #666; margin-top: 20px;"></div>
    </div>

    <script>
        // Configuração
        const SUPABASE_URL = 'https://imfhacvrivasciftaujm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltZmhhY3ZyaXZhc2NpZnRhdWptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzcyODcwNTgsImV4cCI6MjA1Mjg2MzA1OH0.Qn_3ybulLKbSzGCXDEpSYxM4yR9RpAwwPy2hMv3wVuk';

        // Helper para fazer requests ao Supabase
        const supabaseRequest = async (endpoint, options = {}) => {
            const url = `${SUPABASE_URL}/rest/v1${endpoint}`;
            const headers = {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation',
                ...options.headers
            };

            const response = await fetch(url, {
                ...options,
                headers
            });

            if (!response.ok) {
                throw new Error(`Supabase error: ${response.status}`);
            }

            return response.json();
        };

        // Obter parâmetros da URL
        const params = new URLSearchParams(window.location.search);
        const phone = params.get('phone');
        const userName = params.get('name') || 'Utilizador';

        // Estado
        let userLocation = null;
        let userId = null;

        // Mostrar info do utilizador
        if (userName) {
            document.getElementById('userInfo').innerHTML = `👤 ${decodeURIComponent(userName)}`;
        }

        // Relógio
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Atualizar status
        function setStatus(message, type = 'loading') {
            const statusEl = document.getElementById('status');
            statusEl.className = `info-box ${type}`;
            statusEl.innerHTML = message;
        }

        // Obter localização GPS
        async function getLocation() {
            setStatus('<span class="spinner"></span> A obter localização GPS...', 'loading');

            if (!navigator.geolocation) {
                setStatus('❌ GPS não suportado neste dispositivo', 'error');
                return false;
            }

            return new Promise((resolve) => {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        };

                        // Mostrar localização
                        document.getElementById('locationInfo').style.display = 'block';
                        document.getElementById('locationDetails').innerHTML = `
                            Lat: ${userLocation.latitude.toFixed(6)}<br>
                            Lng: ${userLocation.longitude.toFixed(6)}<br>
                            Precisão: ${Math.round(userLocation.accuracy)}m
                        `;

                        setStatus('✅ GPS obtido! Pronto para picar.', 'success');

                        // Ativar botões
                        document.getElementById('btnEntrada').disabled = false;
                        document.getElementById('btnSaida').disabled = false;

                        resolve(true);
                    },
                    (error) => {
                        let message = '❌ Erro ao obter GPS. ';
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                message += 'Por favor, autorize o acesso à localização.';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                message += 'Localização indisponível.';
                                break;
                            case error.TIMEOUT:
                                message += 'Tempo esgotado.';
                                break;
                        }
                        setStatus(message, 'error');
                        resolve(false);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            });
        }

        // Buscar userId pelo telefone
        async function getUserId() {
            if (!phone) {
                setStatus('❌ Número de telefone não identificado', 'error');
                return null;
            }

            try {
                let data = await supabaseRequest(`/users?phone=eq.${phone}&select=id,name`);

                if (!data || data.length === 0) {
                    // Tentar sem prefixo
                    const phoneClean = phone.replace(/^\+?351/, '');
                    data = await supabaseRequest(`/users?phone=eq.${phoneClean}&select=id,name`);

                    if (!data || data.length === 0) {
                        setStatus('❌ Utilizador não encontrado com este telefone', 'error');
                        return null;
                    }
                }

                return data[0].id;
            } catch (err) {
                console.error('Erro ao buscar userId:', err);
                setStatus('❌ Erro ao identificar utilizador', 'error');
                return null;
            }
        }

        // Registar picagem
        async function registerClock(action) {
            if (!userLocation) {
                setStatus('❌ Por favor, aguarde a localização GPS', 'error');
                return;
            }

            if (!userId) {
                setStatus('❌ Utilizador não identificado', 'error');
                return;
            }

            // Desativar botões
            document.getElementById('btnEntrada').disabled = true;
            document.getElementById('btnSaida').disabled = true;

            setStatus('<span class="spinner"></span> A registar...', 'loading');

            try {
                const now = new Date().toISOString();
                const today = now.split('T')[0];

                if (action === 'ENTRADA') {
                    // Criar novo registo
                    await supabaseRequest('/time_logs', {
                        method: 'POST',
                        body: JSON.stringify({
                            user_id: userId,
                            date: today,
                            clock_in: now,
                            location_in: `${userLocation.latitude},${userLocation.longitude}`,
                            created_at: now,
                            updated_at: now
                        })
                    });

                    setStatus(`✅ ENTRADA registada com sucesso!<br><small>${new Date().toLocaleTimeString('pt-PT')}</small>`, 'success');
                } else {
                    // Buscar último registo sem saída
                    const logs = await supabaseRequest(
                        `/time_logs?user_id=eq.${userId}&date=eq.${today}&clock_out=is.null&order=created_at.desc&limit=1`
                    );

                    if (!logs || logs.length === 0) {
                        setStatus('❌ Não há entrada registada para fechar', 'error');
                        document.getElementById('btnEntrada').disabled = false;
                        document.getElementById('btnSaida').disabled = false;
                        return;
                    }

                    // Atualizar com saída
                    await supabaseRequest(`/time_logs?id=eq.${logs[0].id}`, {
                        method: 'PATCH',
                        body: JSON.stringify({
                            clock_out: now,
                            location_out: `${userLocation.latitude},${userLocation.longitude}`,
                            updated_at: now
                        })
                    });

                    setStatus(`✅ SAÍDA registada com sucesso!<br><small>${new Date().toLocaleTimeString('pt-PT')}</small>`, 'success');
                }

                // Reativar botões após 3 segundos
                setTimeout(() => {
                    document.getElementById('btnEntrada').disabled = false;
                    document.getElementById('btnSaida').disabled = false;
                }, 3000);

            } catch (error) {
                console.error('Erro ao registar:', error);
                setStatus('❌ Erro ao registar. Tente novamente.', 'error');
                document.getElementById('btnEntrada').disabled = false;
                document.getElementById('btnSaida').disabled = false;
            }
        }

        // Event listeners
        document.getElementById('btnEntrada').addEventListener('click', () => {
            registerClock('ENTRADA');
        });

        document.getElementById('btnSaida').addEventListener('click', () => {
            registerClock('SAIDA');
        });

        // Inicializar
        async function init() {
            setStatus('<span class="spinner"></span> A verificar utilizador...', 'loading');

            userId = await getUserId();

            if (userId) {
                await getLocation();
            }
        }

        init();
    </script>
</body>
</html>
