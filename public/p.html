<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Picagem SEMRUMO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.c{background:#fff;border-radius:20px;padding:30px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center}
.logo{width:80px;height:80px;margin:0 auto 20px;background:#667eea;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px}
h1{color:#333;margin-bottom:10px;font-size:28px}
.sub{color:#666;margin-bottom:30px;font-size:14px}
.clock{font-size:36px;font-weight:bold;color:#333;margin:20px 0;font-family:'Courier New',monospace}
.info{background:#f0f0f0;padding:15px;border-radius:10px;margin:15px 0;font-size:14px}
.info.ok{background:#d4edda;color:#155724}
.info.err{background:#f8d7da;color:#721c24}
.info.wait{background:#cfe2ff;color:#084298}
.btns{display:flex;gap:10px;margin:20px 0}
button{flex:1;padding:18px;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;transition:all 0.3s;color:#fff}
button:disabled{background:#ccc!important;cursor:not-allowed;opacity:0.6}
.be{background:#28a745}
.be:hover:not(:disabled){background:#218838;transform:translateY(-2px)}
.bs{background:#dc3545}
.bs:hover:not(:disabled){background:#c82333;transform:translateY(-2px)}
.loc{background:#f8f9fa;padding:15px;border-radius:10px;margin-top:20px;font-size:12px;color:#666;display:none}
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(0,0,0,.3);border-radius:50%;border-top-color:#667eea;animation:spin 1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ui{font-size:12px;color:#666;margin-top:20px}
</style>
</head>
<body>
<div class="c">
<div class="logo">⏰</div>
<h1>Picagem Rápida</h1>
<p class="sub">SEMRUMO</p>
<div class="clock" id="ck">--:--:--</div>
<div class="info wait" id="st"><span class="spin"></span> A iniciar...</div>
<div class="btns">
<button class="be" id="be" disabled>✅ ENTRADA</button>
<button class="bs" id="bs" disabled>🚪 SAÍDA</button>
</div>
<div class="loc" id="lc"><strong>📍 Localização:</strong><div id="ld"></div></div>
<div class="ui" id="ui"></div>
</div>
<script>
const U='https://pehkabxxhivuuyrvpmmw.supabase.co/rest/v1';
const K='sb_publishable_xSgX2vkvpslUKi0d92Gkzg_MloeTeAy';
const p=new URLSearchParams(window.location.search);
const ph=p.get('phone');
const nm=p.get('name')||'Utilizador';
let loc=null,uid=null;
const st=document.getElementById('st'),be=document.getElementById('be'),bs=document.getElementById('bs'),lc=document.getElementById('lc'),ld=document.getElementById('ld'),ui=document.getElementById('ui');
ui.innerHTML=`👤 ${decodeURIComponent(nm)}`;
function up(){document.getElementById('ck').textContent=new Date().toTimeString().split(' ')[0]}
setInterval(up,1000);up();
function sh(m,t='wait'){st.className=`info ${t}`;st.innerHTML=m}
async function gps(){sh('<span class="spin"></span> A obter GPS...','wait');if(!navigator.geolocation){sh('❌ GPS não disponível','err');return false}return new Promise(r=>{navigator.geolocation.getCurrentPosition(pos=>{loc={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy};lc.style.display='block';ld.innerHTML=`Lat: ${loc.lat.toFixed(6)}<br>Lng: ${loc.lng.toFixed(6)}<br>Precisão: ${Math.round(loc.acc)}m`;sh('✅ GPS obtido! Pronto para picar.','ok');be.disabled=false;bs.disabled=false;r(true)},err=>{let m='❌ Erro ao obter GPS. ';if(err.code===1)m+='Por favor, autorize o acesso.';else if(err.code===2)m+='GPS indisponível.';else m+='Tempo esgotado.';sh(m,'err');r(false)},{enableHighAccuracy:true,timeout:10000,maximumAge:0})})}
async function gu(){if(!ph){sh('❌ Telefone não identificado','err');return null}try{sh('<span class="spin"></span> A identificar...','wait');const cp=ph.trim().replace(/\s+/g,'');let u=`${U}/users?phone=ilike.*${cp}*&select=id,name,phone`;let res=await fetch(u,{headers:{apikey:K,Authorization:`Bearer ${K}`}});let d=await res.json();if(!d||d.length===0){const p2=cp.replace(/^\+?351/,'');u=`${U}/users?phone=ilike.*${p2}*&select=id,name,phone`;res=await fetch(u,{headers:{apikey:K,Authorization:`Bearer ${K}`}});d=await res.json()}if(!d||d.length===0){sh('❌ Utilizador não encontrado','err');console.error('Phone:',cp);return null}console.log('User:',d[0]);return d[0].id}catch(e){console.error('Error:',e);sh('❌ Erro ao identificar','err');return null}}
async function reg(a){if(!loc){sh('❌ Aguarde GPS','err');return}if(!uid){sh('❌ Utilizador não identificado','err');return}be.disabled=true;bs.disabled=true;sh('<span class="spin"></span> A registar...','wait');try{const n=new Date().toISOString(),t=n.split('T')[0],l=`${loc.lat},${loc.lng}`;if(a==='ENTRADA'){await fetch(`${U}/time_logs`,{method:'POST',headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({user_id:uid,date:t,clock_in:n,location_in:l,created_at:n,updated_at:n})});sh(`✅ ENTRADA registada!<br><small>${new Date().toLocaleTimeString('pt-PT')}</small>`,'ok')}else{const fr=await fetch(`${U}/time_logs?user_id=eq.${uid}&date=eq.${t}&clock_out=is.null&order=created_at.desc&limit=1`,{headers:{apikey:K,Authorization:`Bearer ${K}`}});const lg=await fr.json();if(!lg||lg.length===0){sh('❌ Sem entrada registada','err');be.disabled=false;bs.disabled=false;return}await fetch(`${U}/time_logs?id=eq.${lg[0].id}`,{method:'PATCH',headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({clock_out:n,location_out:l,updated_at:n})});sh(`✅ SAÍDA registada!<br><small>${new Date().toLocaleTimeString('pt-PT')}</small>`,'ok')}setTimeout(()=>{be.disabled=false;bs.disabled=false},3000)}catch(e){console.error('Error:',e);sh('❌ Erro ao registar. Tente novamente.','err');be.disabled=false;bs.disabled=false}}
be.onclick=()=>reg('ENTRADA');
bs.onclick=()=>reg('SAIDA');
async function init(){uid=await gu();if(uid){await gps()}}
init();
</script>
</body>
</html>
